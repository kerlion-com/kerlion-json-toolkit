name: Validate

on:
  push:
    branches: [main]
  pull_request:

jobs:
  syntax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Check JavaScript syntax
        run: node --check app.js

  package:
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/heads/main')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Create release ZIP
        run: |
          zip -r KERLION-JSON-Toolkit-v1.0.0-release.zip index.html styles.css app.js README.md LICENSE assets
      - name: Upload release package artifact
        uses: actions/upload-artifact@v4
        with:
          name: KERLION-JSON-Toolkit-v1.0.0-release
          path: KERLION-JSON-Toolkit-v1.0.0-release.zip
          if-no-files-found: error
          retention-days: 30
